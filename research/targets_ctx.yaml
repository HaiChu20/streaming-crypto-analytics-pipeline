version: "v1-ctx"
calendar: config/events.csv
horizons_s: [300, 900, 1800]
# BTC and ETH see each other's venues as ctx_<asset>_* features (R3); the target asset itself is skipped.
context_assets: [BTC, ETH]
references:
  BTC:
    spot: {exchange: binance, market: spot, symbol: BTCUSDT}
    perp: {exchange: binance, market: perp, symbol: BTCUSDT}
  ETH:
    spot: {exchange: binance, market: spot, symbol: ETHUSDT}
    perp: {exchange: binance, market: perp, symbol: ETHUSDT}

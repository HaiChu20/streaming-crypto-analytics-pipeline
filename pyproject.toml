[project]
name = "streaming-crypto-analytics-pipeline"
version = "0.1.0"
description = "BTC/ETH spot + perp market data from Kraken, Binance and OKX via Kafka into a replayable raw archive"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.40.56",
    "confluent-kafka==2.15.1",
    "httpx==0.28.1",
    "lightgbm==4.6.0",
    "orjson==3.12.0",
    "polars==1.34.0",
    "pyarrow==21.0.0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "websockets==17.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
# Only resolve releases that are at least two weeks old.
exclude-newer = "2026-10-03T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

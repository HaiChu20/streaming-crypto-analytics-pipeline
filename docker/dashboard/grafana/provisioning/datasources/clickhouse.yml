apiVersion: 1
datasources:
  - name: ClickHouse
    uid: crypto-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: dashboard
      defaultDatabase: crypto
      dialTimeout: "10"
      queryTimeout: "20"
    secureJsonData:
      password: dashboard-local
